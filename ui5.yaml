specVersion: "3.1"
metadata:
  name: cross.fnd.fiori.inbox.ca_fiori_inboxextension2
type: application
server:
  customMiddleware:
    - name: fiori-tools-proxy
      afterMiddleware: compression
      configuration:
        ignoreCertError: false
        backend:
          - path: /sap
            url: http://sapds401.melisap.com:44301
            client: "200"
            destination: s4desrt_200
        ui5:
          path:
            - /resources
            - /test-resources
          url: https://ui5.sap.com
          version: 1.96.25
    - name: fiori-tools-appreload
      afterMiddleware: compression
      configuration:
        port: 35729
        path: webapp
        delay: 300
    - name: fiori-tools-preview
      afterMiddleware: fiori-tools-appreload
      configuration:
        component: cross.fnd.fiori.inbox.CA_FIORI_INBOXExtension2
        ui5Theme: sap_bluecrystal
